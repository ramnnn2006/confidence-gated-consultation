    <rect x="835" y="38" width="190" height="55" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="845" y="55" font-size="11" font-weight="bold" fill="#f8fafc">Documentation</text>
    <text x="845" y="72" font-size="10" fill="#94a3b8">REVIEW_2_OFFICIAL_REPORT.md</text>
